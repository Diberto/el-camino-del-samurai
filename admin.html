<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard | El Camino del Samurai</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="src/admin/admin.css">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body class="admin-body">
  <div id="login-modal" class="admin-login-modal">
    <div class="login-box">
      <h2 style="font-family:'Cinzel', serif; color:#e2e8f0; margin-top:0;">Panel Samurai Admin</h2>
      <p style="color:#a0aec0; font-size:0.9rem;">Ingresa tus credenciales para acceder</p>
      <form id="login-form">
        <div class="form-group" style="margin-bottom:1rem;">
          <label style="display:block; margin-bottom:0.4rem; color:#cbd5e0; font-size:0.85rem;">Email</label>
          <input type="email" id="login-email" required value="admin@samurai.com" style="width:100%; padding:0.6rem; background:#242832; border:1px solid #4a5568; color:#fff; border-radius:4px; box-sizing:border-box;">
        </div>
        <div class="form-group" style="margin-bottom:1rem;">
          <label style="display:block; margin-bottom:0.4rem; color:#cbd5e0; font-size:0.85rem;">Contraseña</label>
          <input type="password" id="login-password" required value="admin123" style="width:100%; padding:0.6rem; background:#242832; border:1px solid #4a5568; color:#fff; border-radius:4px; box-sizing:border-box;">
        </div>
        <div id="login-error" class="login-error" style="color:#e53e3e; margin-bottom:1rem; font-size:0.85rem;"></div>
        <button type="submit" style="width:100%; padding:0.8rem; background:#3182ce; color:#fff; border:none; border-radius:6px; font-weight:600; cursor:pointer;">Iniciar Sesión</button>
      </form>
    </div>
  </div>

  <div id="admin-app" class="admin-layout hidden">
    <aside class="admin-sidebar">
      <div class="sidebar-header">
        <span class="logo-symbol">⚔️</span>
        <h3 style="font-family:'Cinzel', serif; margin:0; display:inline-block;">Samurai Admin</h3>
      </div>
      <nav class="sidebar-nav">
        <button class="nav-item active" data-tab="sections">🚩 Secciones y Menú</button>
        <button class="nav-item" data-tab="gpu">⚙️ Opciones GPU</button>
        <button class="nav-item" data-tab="blog">✍️ Blog CMS</button>
        <button class="nav-item" data-tab="users">👥 Usuarios</button>
      </nav>
      <div class="sidebar-footer" style="border-top:1px solid #2d3748; padding-top:1rem; margin-top:auto;">
        <div class="user-info" style="margin-bottom:0.8rem; font-size:0.85rem; color:#a0aec0;">
          Usuario: <strong id="user-display-name" style="color:#fff;">Admin</strong>
        </div>
        <button id="logout-btn" style="width:100%; padding:0.6rem; background:#e53e3e; color:#fff; border:none; border-radius:4px; cursor:pointer;">Cerrar Sesión</button>
      </div>
    </aside>

    <main class="admin-content">
      <section id="tab-sections" class="tab-panel active"></section>
      <section id="tab-gpu" class="tab-panel"></section>
      <section id="tab-blog" class="tab-panel"></section>
      <section id="tab-users" class="tab-panel"></section>
    </main>
  </div>

  <script type="module" src="src/admin/admin.js"></script>
</body>
</html>
